name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    name: Install, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Compile-only placeholders. Real deploys must set these on the host.
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
